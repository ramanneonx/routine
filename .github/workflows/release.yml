name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify or Build Release APK
        run: |
          if [ -f "release/NeonRoutine-release.apk" ]; then
            echo "Pre-built APK found in release/"
            cp release/NeonRoutine-release.apk NeonRoutine-release.apk
          else
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/*.apk NeonRoutine-release.apk || cp build/outputs/apk/release/*.apk NeonRoutine-release.apk
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: NeonRoutine Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            NeonRoutine-release.apk
            release/NeonRoutine-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
