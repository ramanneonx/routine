# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments - increased heap for faster Kotlin compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel execution for faster builds
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# Kotlin code style
kotlin.code.style=official

# AndroidX
android.useAndroidX=true

# Required: KSP needs this for Room annotation processing with built-in Kotlin
android.disallowKotlinSourceSets=false

# 16 KB Page Size Alignment Support
android.bundle.enableUncompressedNativeLibs=true
android.useLegacyPackaging=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
